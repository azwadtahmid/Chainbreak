<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="CHAINBREAK Freshers Fair posters — Brunel Blockchain Society.">
<title>CHAINBREAK — Freshers Fair Posters</title>
<link rel="icon" href="../assets/logo-mark.png" type="image/png">
<style>
  :root{
    --bg:#04070c; --line:#17283d; --cy:#00e5ff; --dim:#7b93ad; --faint:#4a6180;
    --mono:"JetBrains Mono","SF Mono","Cascadia Mono",Consolas,"Roboto Mono",ui-monospace,monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; background:#07080b; color:#d7e6f5; font-family:var(--mono); }
  body{ padding:28px 20px 60px; }

  header{ text-align:center; margin-bottom:26px; }
  h1{ font-size:20px; letter-spacing:.3em; margin:0 0 8px; color:#eafcff; text-indent:.3em; }
  .sub{ font-size:11px; letter-spacing:.2em; color:var(--faint); }

  .bar{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:22px 0 30px; }
  button{
    font-family:var(--mono); font-size:11px; letter-spacing:.14em; font-weight:700;
    background:linear-gradient(180deg, rgba(0,229,255,.14), rgba(0,229,255,.04));
    border:1px solid var(--line); color:#eafcff; border-radius:4px;
    padding:11px 18px; cursor:pointer; transition:border-color .2s, box-shadow .2s;
  }
  button:hover{ border-color:var(--cy); box-shadow:0 0 20px rgba(0,229,255,.3); }
  button[disabled]{ opacity:.4; cursor:not-allowed; }

  .grid{ display:flex; flex-wrap:wrap; gap:26px; justify-content:center; }
  .card{ width:min(300px, 84vw); }
  .card canvas{
    width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:4px;
    background:#04070c; box-shadow:0 16px 50px rgba(0,0,0,.6);
  }
  .meta{ margin-top:12px; }
  .meta .n{ font-size:12px; letter-spacing:.14em; color:var(--cy); }
  .meta .b{ font-size:11px; color:var(--faint); line-height:1.7; margin-top:5px; letter-spacing:.04em; }
  .meta button{ margin-top:10px; width:100%; padding:9px; font-size:10px; }
  #status{ text-align:center; font-size:11px; letter-spacing:.14em; color:var(--faint); min-height:16px; margin-top:22px; }
  #status.on{ color:var(--cy); }
</style>
</head>
<body>

<header>
  <h1>FRESHERS FAIR POSTERS</h1>
  <div class="sub">A3 PORTRAIT &middot; 300 DPI &middot; 3508 &times; 4961 PX &middot; BRUNEL BLOCKCHAIN SOCIETY</div>
</header>

<div class="bar">
  <button id="dl-all">↓ DOWNLOAD ALL 5 (A3, 300 DPI PNG)</button>
  <button id="dl-social">↓ DOWNLOAD ALL 5 (SOCIAL, 1200×1697)</button>
</div>

<div class="grid" id="grid"></div>
<div id="status"></div>

<script src="posters.js"></script>
<script>
(function () {
  'use strict';
  var grid = document.getElementById('grid');
  var statusEl = document.getElementById('status');
  var assets = {};

  function status(m, on) { statusEl.textContent = m || ''; statusEl.className = on ? 'on' : ''; }

  function load(src) {
    return new Promise(function (res) {
      var i = new Image();
      i.onload = function () { res(i); };
      i.onerror = function () { res(null); };
      i.src = src;
    });
  }

  function save(canvas, name) {
    return new Promise(function (res) {
      canvas.toBlob(function (blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); res(); }, 900);
      }, 'image/png');
    });
  }

  /** Full-size render happens off-screen only when exporting. */
  function exportOne(i, wide, label) {
    var off = document.createElement('canvas');
    Posters.render(off, i, assets, wide);
    return save(off, 'chainbreak-poster-' + (i + 1) + '-' + Posters.list[i].id + '-' + label + '.png');
  }

  Promise.all([load('../assets/logo.png'), load('../assets/join-qr.png')]).then(function (r) {
    assets.logo = r[0]; assets.qr = r[1];
    if (!assets.qr) status('QR IMAGE MISSING — POSTERS WILL RENDER WITHOUT IT');

    Posters.list.forEach(function (p, i) {
      var card = document.createElement('div');
      card.className = 'card';
      var cv = document.createElement('canvas');
      card.appendChild(cv);

      var meta = document.createElement('div');
      meta.className = 'meta';
      var n = document.createElement('div'); n.className = 'n'; n.textContent = p.name;
      var b = document.createElement('div'); b.className = 'b'; b.textContent = p.blurb;
      var btn = document.createElement('button');
      btn.type = 'button'; btn.textContent = '↓ A3 300 DPI';
      btn.addEventListener('click', function () {
        status('RENDERING POSTER ' + (i + 1) + ' AT 300 DPI…');
        setTimeout(function () {
          exportOne(i, Posters.A3_300DPI.w, 'A3-300dpi').then(function () {
            status('SAVED POSTER ' + (i + 1), true);
          });
        }, 30);
      });
      meta.appendChild(n); meta.appendChild(b); meta.appendChild(btn);
      card.appendChild(meta);
      grid.appendChild(card);

      Posters.render(cv, i, assets, 620);     // on-screen preview
    });

    status('5 POSTERS READY');
  });

  function bulk(wide, label) {
    var i = 0;
    function next() {
      if (i >= Posters.list.length) { status('ALL 5 SAVED', true); return; }
      status('RENDERING ' + (i + 1) + ' OF ' + Posters.list.length + '…');
      exportOne(i, wide, label).then(function () { i++; setTimeout(next, 250); });
    }
    next();
  }

  document.getElementById('dl-all').addEventListener('click', function () {
    bulk(Posters.A3_300DPI.w, 'A3-300dpi');
  });
  document.getElementById('dl-social').addEventListener('click', function () {
    bulk(Posters.W, 'social');
  });
})();
</script>
</body>
</html>
